<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hd { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .src { font-size: 15.5px; font-weight: 600; fill: #1A202C; }
      .c { font-size: 14px; fill: #1A202C; }
      .k { font-size: 13.5px; fill: #4A5568; }
      .g { fill: #C6F6D5; } .p { fill: #FEEBC8; } .n { fill: #FED7D7; }
      .row { fill: #FFFFFF; stroke: #E2E8F0; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#FFFFFF"/>
  <text x="700" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1A202C">Every native signal answers only part of "who changed what, when"</text>

  <!-- header -->
  <rect x="30" y="65" width="1340" height="46" rx="6" fill="#2D3748"/>
  <text x="45" y="94" class="hd">Source</text>
  <text x="345" y="94" class="hd">Who</text>
  <text x="565" y="94" class="hd">What changed</text>
  <text x="845" y="94" class="hd">When</text>
  <text x="1045" y="94" class="hd">The catch</text>

  <!-- rows: y start 115, height 74 -->
  <g>
    <rect x="30" y="115" width="1340" height="74" class="row"/>
    <text x="45" y="148" class="src">Dataverse audit table</text>
    <rect x="335" y="121" width="210" height="62" rx="6" class="p"/><text x="347" y="147" class="c">Yes, but only for</text><text x="347" y="168" class="c">deletes and role edits</text>
    <rect x="555" y="121" width="270" height="62" rx="6" class="p"/><text x="567" y="147" class="c">Table/column deletes,</text><text x="567" y="168" class="c">role privileges, audit toggles</text>
    <rect x="835" y="121" width="190" height="62" rx="6" class="g"/><text x="847" y="157" class="c">Exact</text>
    <text x="1045" y="147" class="k">No events for creating or editing definitions.</text><text x="1045" y="168" class="k">Forms and web resources can't be audited.</text>
  </g>
  <g>
    <rect x="30" y="189" width="1340" height="74" class="row"/>
    <text x="45" y="222" class="src">modifiedby on component rows</text>
    <rect x="335" y="195" width="210" height="62" rx="6" class="p"/><text x="347" y="231" class="c">Last writer only</text>
    <rect x="555" y="195" width="270" height="62" rx="6" class="n"/><text x="567" y="231" class="c">Nothing</text>
    <rect x="835" y="195" width="190" height="62" rx="6" class="p"/><text x="847" y="231" class="c">Last write only</text>
    <text x="1045" y="221" class="k">Forms (systemform) and table/column</text><text x="1045" y="242" class="k">definitions don't have it at all.</text>
  </g>
  <g>
    <rect x="30" y="263" width="1340" height="74" class="row"/>
    <text x="45" y="296" class="src">Purview activity log</text>
    <rect x="335" y="269" width="210" height="62" rx="6" class="g"/><text x="347" y="305" class="c">User UPN</text>
    <rect x="555" y="269" width="270" height="62" rx="6" class="p"/><text x="567" y="295" class="c">Message and table,</text><text x="567" y="316" class="c">no before/after values</text>
    <rect x="835" y="269" width="190" height="62" rx="6" class="p"/><text x="847" y="305" class="c">60–90+ min late</text>
    <text x="1045" y="295" class="k">Production environments only.</text><text x="1045" y="316" class="k">180-day standard retention.</text>
  </g>
  <g>
    <rect x="30" y="337" width="1340" height="74" class="row"/>
    <text x="45" y="370" class="src">Solution history</text>
    <rect x="335" y="343" width="210" height="62" rx="6" class="n"/><text x="347" y="379" class="c">No user column</text>
    <rect x="555" y="343" width="270" height="62" rx="6" class="p"/><text x="567" y="369" class="c">Operation, solution,</text><text x="567" y="390" class="c">version</text>
    <rect x="835" y="343" width="190" height="62" rx="6" class="g"/><text x="847" y="379" class="c">Start and end time</text>
    <text x="1045" y="369" class="k">Rows are purged after 180 days.</text><text x="1045" y="390" class="k">Covers imports and publishes, not edits.</text>
  </g>
  <g>
    <rect x="30" y="411" width="1340" height="74" class="row"/>
    <text x="45" y="444" class="src">Solution layers</text>
    <rect x="335" y="417" width="210" height="62" rx="6" class="n"/><text x="347" y="453" class="c">No user column</text>
    <rect x="555" y="417" width="270" height="62" rx="6" class="p"/><text x="567" y="443" class="c">Layer JSON,</text><text x="567" y="464" class="c">current state only</text>
    <rect x="835" y="417" width="190" height="62" rx="6" class="p"/><text x="847" y="453" class="c">Overwrite time</text>
    <text x="1045" y="443" class="k">All makers' edits collapse into one</text><text x="1045" y="464" class="k">unmanaged layer.</text>
  </g>
  <g>
    <rect x="30" y="485" width="1340" height="74" class="row"/>
    <text x="45" y="518" class="src">RetrieveMetadataChanges</text>
    <rect x="335" y="491" width="210" height="62" rx="6" class="n"/><text x="347" y="527" class="c">No user</text>
    <rect x="555" y="491" width="270" height="62" rx="6" class="g"/><text x="567" y="517" class="c">Table, column, relationship</text><text x="567" y="538" class="c">and choice changes</text>
    <rect x="835" y="491" width="190" height="62" rx="6" class="p"/><text x="847" y="527" class="c">Between polls</text>
    <text x="1045" y="517" class="k">The change stamp expires (7 days in our test</text><text x="1045" y="538" class="k">environment). Polling only: there's no event.</text>
  </g>

  <!-- ours -->
  <rect x="30" y="571" width="1340" height="160" rx="8" fill="#F7FAFC" stroke="#2F855A" stroke-width="2"/>
  <text x="45" y="595" font-size="13" font-weight="700" fill="#2F855A">WHAT THIS PROJECT ADDS</text>
  <g>
    <text x="45" y="635" class="src">Plug-in on Publish / PublishAll</text>
    <rect x="335" y="608" width="210" height="56" rx="6" class="g"/><text x="347" y="641" class="c">The user who published</text>
    <rect x="555" y="608" width="270" height="56" rx="6" class="p"/><text x="567" y="631" class="c">Which components were</text><text x="567" y="651" class="c">published (no diff)</text>
    <rect x="835" y="608" width="190" height="56" rx="6" class="g"/><text x="847" y="641" class="c">Exact</text>
    <text x="1045" y="631" class="k">PublishAll has no component list. Imports and</text><text x="1045" y="651" class="k">metadata calls don't go through Publish.</text>
  </g>
  <g>
    <text x="45" y="703" class="src">Snapshots + Git diff</text>
    <rect x="335" y="670" width="210" height="56" rx="6" class="n"/><text x="347" y="703" class="c">No user</text>
    <rect x="555" y="670" width="270" height="56" rx="6" class="g"/><text x="567" y="703" class="c">Full XML/JSON diff</text>
    <rect x="835" y="670" width="190" height="56" rx="6" class="p"/><text x="847" y="703" class="c">Between polls</text>
    <text x="1045" y="693" class="k">You keep the history as long as you want.</text><text x="1045" y="713" class="k">The correlation step adds the "who".</text>
  </g>

  <!-- legend -->
  <rect x="380" y="760" width="22" height="22" rx="4" class="g"/><text x="410" y="777" class="c">Full answer</text>
  <rect x="560" y="760" width="22" height="22" rx="4" class="p"/><text x="590" y="777" class="c">Partial answer</text>
  <rect x="760" y="760" width="22" height="22" rx="4" class="n"/><text x="790" y="777" class="c">Nothing</text>
</svg>
